name: Import complete Olist portfolio
on:
  push:
    paths:
      - 'transfer_parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract portfolio files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          import base64
          chunks=sorted(Path('transfer_parts').glob('part_*.b64'))
          if not chunks: raise RuntimeError('No upload parts found')
          archive=Path('project_bundle.zip')
          archive.write_bytes(base64.b64decode(''.join(p.read_text().strip() for p in chunks)))
          with ZipFile(archive) as z:
              paths=[p for p in z.namelist() if p and not p.endswith('/')]
              roots={p.split('/')[0] for p in paths}
              if len(roots)!=1: raise RuntimeError('Unexpected project archive layout')
              root=next(iter(roots)) + '/'
              for info in z.infolist():
                  if info.is_dir() or not info.filename.startswith(root): continue
                  rel=Path(info.filename[len(root):])
                  if not rel.parts or '..' in rel.parts: raise RuntimeError('Invalid archive path')
                  dest=Path('.')/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src, open(dest,'wb') as dst: shutil.copyfileobj(src,dst)
          archive.unlink()
          shutil.rmtree('transfer_parts')
          PY
      - name: Publish complete portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Import complete Olist Commerce Intelligence portfolio" && git push)
